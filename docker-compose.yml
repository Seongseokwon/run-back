# 로컬 개발용 Postgres. 프로덕션은 Neon(관리형)을 쓴다 — 같은 Postgres라
# 스키마·마이그레이션·쿼리가 전부 동일하고 DATABASE_URL 한 줄만 다르다.
#
# 로컬을 Docker 로 두는 이유: 오프라인에서 되고, 스키마를 몇 번이든 날려서
# 다시 만들 수 있다. 클라우드 DB 에 붙어서 개발하면 마이그레이션 실험이 비싸진다.
#
#   docker compose up -d      띄우기
#   docker compose down -v    데이터까지 지우기 (스키마를 갈아엎을 때)

services:
  postgres:
    image: postgres:17-alpine
    container_name: runback-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: runback
      POSTGRES_PASSWORD: runback_local
      POSTGRES_DB: runback
      # 한글 정렬·비교를 로케일에 의존하지 않게 한다. 대회 이름 정렬은 앱에서 한다
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      - '5432:5432'
    volumes:
      - runback-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U runback -d runback']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  runback-pgdata:
